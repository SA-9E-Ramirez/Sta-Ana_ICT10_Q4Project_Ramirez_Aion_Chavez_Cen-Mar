<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Body Count</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>

    <py-config>
        packages = ["numpy", "matplotlib"]
    </py-config>

    <!-- Custom Colors -->
    <style>
        nav {
                background-color: #333;
                color: white;
                padding: 0.75rem 1rem;
            }

            .nav-container {
                display: flex;
                align-items: center;
                justify-content: space-between;
                max-width: 1200px;
                margin: 0 auto;
            }

            .nav-logo {
                font-size: 1.1rem;
                font-weight: bold;
            }

            .nav-links {
                display: flex;
                gap: 1rem;
            }

            .nav-links a {
                color: white;
                text-decoration: none;
                padding: 0.5rem 0.75rem;
                transition: background-color 0.2s ease;
            }

            .nav-links a:hover {
                background-color: rgba(255, 255, 255, 0.15);
                border-radius: 4px;
            }
        body {
            background-color: black;
        }
        .card-custom {
            background-color: #333;
            border-radius: 20px;
            border: 3px solid #ccc;
        }
        .btn-custom {
            background-color: red;
            color: black;
        }
        .btn-custom:hover {
            background-color: #c82333;
        }
        .title-text {
            color: red;
            font-weight: bold;
        }
        #output {
            background-color: red;
            color: white;
            border-radius: 10px;
        }
        label {
            color: red;
        }
    </style>
</head>

<body class="d-flex flex-column align-items-center min-vh-100 pt-4">

    <nav class="navbar navbar-expand-lg navbar-dark w-100">
        <div class="nav-container">
            <div class="nav-logo">Code BLACK</div>
                <div class="nav-links">
                    <a href="index.html">Hit List</a>
                    <a href="chart.html">Weekly Kills</a>
                    <a href="museum.html">Infiltrations</a>
                </div>
            </div>
    </nav>

    <div class="card card-custom shadow-lg p-4 mt-4" style="width: 400px;">
        <h3 class="text-center title-text mb-4">Weekly Body Count</h3>

        <form>
            <div class="mb-3">
                <label class="form-label fw-bold">Select Day</label>
                <select id="dayOfTheWeek" class="form-select">
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Kill Count</label>
                <input type="number" id="kills" class="form-control" placeholder="Enter number of kills">
            </div>

            <div class="d-grid">
                <input type="button" py-click="displaying" value="Submit" class="btn btn-custom">
            </div>
        </form>

        <div id="output" class="mt-3 p-2 text-center fs-5"></div>
    </div>
    <py-script src="chartpy.py"></py-script>
</body>
</html>
